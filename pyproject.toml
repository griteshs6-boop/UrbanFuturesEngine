[project]
name = "urban-futures"
version = "0.1.0"
description = "Urban Futures Engine — multi-city urban development simulation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow",
    "duckdb>=1.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj",
    "rasterio>=1.3",
    "rtree",
    "h3>=4.0",
    "osmnx>=2.0",
    "networkx>=3.2",
    "exactextract",
    "tobler",
    "libpysal",
    "spreg",
    "momepy",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "xlogit",
    "SALib>=1.5",
    "stackstac",
    "pystac-client",
    "xarray",
    "dask",
    "pandera>=0.20",
    "pydantic>=2.7",
    "PyYAML",
    "typer",
    "rich",
    "httpx",
    "anthropic",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "pip-licenses"]

[project.scripts]
ufe = "ufe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ufe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: ACCEPTANCE blocks from the build spec",
    "slow: long-running tests",
    "needs_osrm: requires a live OSRM service",
    "needs_data: requires real ingested data",
]
