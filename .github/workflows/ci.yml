name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  licence-audit:
    name: Licence audit (Section 2.4 / 22.2) — required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (with dev extras)
        run: uv sync --extra dev

      - name: Software dependency licence audit (Section 2.4)
        run: uv run ufe licences audit

      - name: Data source licence audit (Section 22.2)
        run: uv run ufe licences audit --data

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: licence-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (with dev extras)
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest
